name: CI — Tests (DB_STRICT_INIT)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test-db-strict:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            use_simple_jwt: ''
          - os: windows-latest
            use_simple_jwt: '1'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest-cov
      - name: Run tests with DB_STRICT_INIT=true and coverage enforcement
        env:
          DB_STRICT_INIT: 'true'
          USE_SIMPLE_JWT: ${{ matrix.use_simple_jwt }}
        run: |
          python -m pytest backend/tests -q --cov=backend --cov-fail-under=50
    # end job
