name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: [3.9]
        os: [ubuntu-latest, windows-latest]
        use_simple_jwt: ["1", ""]
    steps:
      - uses: actions/checkout@v4
        with:
          # Fetch full history so in-run git commands (tag/describe etc.) work
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Install pytest-cov in CI to allow coverage enforcement
          pip install pytest-cov
      - name: Dump git metadata (Linux / macOS)
        if: runner.os != 'Windows'
        run: |
          mkdir -p diagnostics
          DIAG_FILE="diagnostics/git-diagnostics-${{ matrix.os }}-${{ matrix.use_simple_jwt }}-py${{ matrix.python-version }}.txt"
          echo "=== GIT DIAGNOSTIC (non-Windows) ===" | tee "$DIAG_FILE"
          git --version 2>&1 | tee -a "$DIAG_FILE" || true
          echo "is shallow: $(git rev-parse --is-shallow-repository 2>/dev/null || true)" | tee -a "$DIAG_FILE"
          git rev-parse --show-toplevel 2>/dev/null | tee -a "$DIAG_FILE" || true
          git rev-parse HEAD 2>/dev/null | tee -a "$DIAG_FILE" || true
          git show -s --format=%H --no-patch HEAD 2>/dev/null | tee -a "$DIAG_FILE" || true
          git status --porcelain --branch 2>/dev/null | tee -a "$DIAG_FILE" || true
          git log -5 --oneline 2>/dev/null | tee -a "$DIAG_FILE" || true
          git remote -v 2>/dev/null | tee -a "$DIAG_FILE" || true
          echo "GITHUB_SHA=${GITHUB_SHA}" | tee -a "$DIAG_FILE"
          echo "GITHUB_REF=${GITHUB_REF}" | tee -a "$DIAG_FILE"
          echo "GITHUB_WORKFLOW=${GITHUB_WORKFLOW}" | tee -a "$DIAG_FILE"
          echo "matrix.use_simple_jwt=${{ matrix.use_simple_jwt }}" | tee -a "$DIAG_FILE"
      - name: Dump git metadata (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path diagnostics | Out-Null
          $diag = "diagnostics\\git-diagnostics-${{ matrix.os }}-${{ matrix.use_simple_jwt }}-py${{ matrix.python-version }}.txt"
          "=== GIT DIAGNOSTIC (Windows) ===" | Tee-Object -FilePath $diag -Append
          git --version 2>&1 | Tee-Object -FilePath $diag -Append
          try { $isShallow = git rev-parse --is-shallow-repository 2>$null; Write-Host "is shallow: $isShallow"; "is shallow: $isShallow" | Tee-Object -FilePath $diag -Append } catch { "is shallow: <error>" | Tee-Object -FilePath $diag -Append }
          try { git rev-parse --show-toplevel 2>$null | Tee-Object -FilePath $diag -Append } catch {}
          try { git rev-parse HEAD 2>$null | Tee-Object -FilePath $diag -Append } catch {}
          try { git show -s --format=%H --no-patch HEAD 2>$null | Tee-Object -FilePath $diag -Append } catch {}
          try { git status --porcelain --branch 2>$null | Tee-Object -FilePath $diag -Append } catch {}
          try { git log -5 --oneline 2>$null | Tee-Object -FilePath $diag -Append } catch {}
          try { git remote -v 2>$null | Tee-Object -FilePath $diag -Append } catch {}
          "GITHUB_SHA=$env:GITHUB_SHA" | Tee-Object -FilePath $diag -Append
          "GITHUB_REF=$env:GITHUB_REF" | Tee-Object -FilePath $diag -Append
          "GITHUB_WORKFLOW=$env:GITHUB_WORKFLOW" | Tee-Object -FilePath $diag -Append
          "matrix.use_simple_jwt=${{ matrix.use_simple_jwt }}" | Tee-Object -FilePath $diag -Append
      - name: Run tests with coverage enforcement (non-Windows)
        if: runner.os != 'Windows'
        env:
          USE_SIMPLE_JWT: ${{ matrix.use_simple_jwt }}
          # Enable git trace to capture any git subcommands invoked during tests
          GIT_TRACE: "1"
        run: |
          set -o pipefail
          mkdir -p diagnostics
          DIAG_PYTEST_FILE="diagnostics/pytest-${{ matrix.os }}-${{ matrix.use_simple_jwt }}-py${{ matrix.python-version }}.log"
          python -m pytest backend/tests -q --cov=backend --cov-fail-under=80 2>&1 | tee "$DIAG_PYTEST_FILE"
          if [ ${PIPESTATUS[0]} -ne 0 ]; then exit ${PIPESTATUS[0]}; fi

      - name: Run tests with coverage enforcement (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          USE_SIMPLE_JWT: ${{ matrix.use_simple_jwt }}
          GIT_TRACE: "1"
        run: |
          New-Item -ItemType Directory -Force -Path diagnostics | Out-Null
          $diag = "diagnostics\\pytest-${{ matrix.os }}-${{ matrix.use_simple_jwt }}-py${{ matrix.python-version }}.log"
          python -m pytest backend/tests -q --cov=backend --cov-fail-under=80 2>&1 | Tee-Object -FilePath $diag -Encoding UTF8
          $exit = $LASTEXITCODE
          if ($exit -ne 0) { exit $exit }
      - name: Upload diagnostics artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: git-diagnostics-${{ matrix.os }}-${{ matrix.use_simple_jwt }}
          path: diagnostics
